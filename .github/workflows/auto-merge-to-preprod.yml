# .github/workflows/auto-merge-to-preprod.yml
name: Auto-merge to pre-prod

on:
  push:
    branches:
      - dev    # ← when dev is updated, auto-merge into pre-prod

jobs:
  auto-merge:
    name: Merge dev into pre-prod
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GHCR_PAT }}

      - name: Merge dev into pre-prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout pre-prod
          git reset --hard origin/dev
          # No [skip ci] — CI must run and build images for this SHA
          git push origin pre-prod --force-with-lease
