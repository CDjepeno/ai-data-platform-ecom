# .github/workflows/auto-merge-to-preprod.yml
name: Auto-merge to pre-prod

on:
  push:
    branches:
      - dev    # ← when dev is updated, auto-merge into pre-prod

jobs:
  auto-merge:
    name: Merge dev into pre-prod
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GHCR_PAT }}

      - name: Merge dev into pre-prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout pre-prod
          git merge origin/dev --no-edit -m "auto: merge dev into pre-prod [skip ci]"
          git push origin pre-prod