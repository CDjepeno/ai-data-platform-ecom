name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, pre-prod, main]

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run linter on semantic_layer
        run: |
          cd src/semantic_layer && ruff check . --exit-zero

      - name: Run linter on fast_api
        run: |
          cd src/fast_api && ruff check . --exit-zero

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests/ -v --tb=short
        continue-on-error: true

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: lint-and-test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push semantic-layer image
        uses: docker/build-push-action@v5
        with:
          context: ./src/semantic_layer
          push: true
          build-args: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          tags: |
            ghcr.io/cdjepeno/ecom-semantic-layer:${{ github.sha }}
            ghcr.io/cdjepeno/ecom-semantic-layer:latest

      - name: Build and push fastapi image
        uses: docker/build-push-action@v5
        with:
          context: ./src/fast_api
          push: true
          tags: |
            ghcr.io/cdjepeno/ecom-fastapi:${{ github.sha }}
            ghcr.io/cdjepeno/ecom-fastapi:latest

      - name: Build and push pipeline image
        uses: docker/build-push-action@v5
        with:
          context: ./src/etl_ecom
          push: true
          tags: |
            ghcr.io/cdjepeno/ecom-pipeline:${{ github.sha }}
            ghcr.io/cdjepeno/ecom-pipeline:latest

      - name: Build and push mcp image
        uses: docker/build-push-action@v5
        with:
          context: ./src/mcp
          push: true
          tags: |
            ghcr.io/cdjepeno/ecom-mcp:${{ github.sha }}
            ghcr.io/cdjepeno/ecom-mcp:latest
