name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, pre-prod, main]

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run linter
        run: |
          ruff check src/semantic_layer/
          ruff check src/fast_api/
          ruff check src/etl_ecom/
          ruff check src/mcp/

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ CI lint failed on *${{ github.repository }}* branch `${{ github.ref_name }}`",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "❌ *Lint failed* on `${{ github.ref_name }}`\n*Author:* ${{ github.actor }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: lint-and-test

    outputs:
      image-tag: ${{ steps.set-tag.outputs.image-tag }}
      ci-run-id: ${{ github.run_id }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TAG="pr-${{ github.event.pull_request.number }}-${{ github.sha }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "image-tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      
      - name: Build and push nextjs image
        uses: docker/build-push-action@v5
        with:
          context: ./src/next_js
          push: true
          provenance: false
          cache-from: type=registry,ref=ghcr.io/cdjepeno/ecom-nextjs:buildcache
          cache-to: type=registry,ref=ghcr.io/cdjepeno/ecom-nextjs:buildcache,mode=max
          tags: |
            ghcr.io/cdjepeno/ecom-nextjs:${{ steps.set-tag.outputs.image-tag }}
            ghcr.io/cdjepeno/ecom-nextjs:latest

      - name: Build and push semantic-layer image
        uses: docker/build-push-action@v5
        with:
          context: ./src/semantic_layer
          push: true
          provenance: false
          cache-from: type=registry,ref=ghcr.io/cdjepeno/ecom-semantic-layer:buildcache
          cache-to: type=registry,ref=ghcr.io/cdjepeno/ecom-semantic-layer:buildcache,mode=max
          tags: |
            ghcr.io/cdjepeno/ecom-semantic-layer:${{ steps.set-tag.outputs.image-tag }}
            ghcr.io/cdjepeno/ecom-semantic-layer:latest

      - name: Build and push fastapi image
        uses: docker/build-push-action@v5
        with:
          context: ./src/fast_api
          push: true
          provenance: false
          cache-from: type=registry,ref=ghcr.io/cdjepeno/ecom-fastapi:buildcache
          cache-to: type=registry,ref=ghcr.io/cdjepeno/ecom-fastapi:buildcache,mode=max
          tags: |
            ghcr.io/cdjepeno/ecom-fastapi:${{ steps.set-tag.outputs.image-tag }}
            ghcr.io/cdjepeno/ecom-fastapi:latest

      - name: Build and push pipeline image
        uses: docker/build-push-action@v5
        with:
          context: ./src/etl_ecom
          push: true
          provenance: false
          cache-from: type=registry,ref=ghcr.io/cdjepeno/ecom-pipeline:buildcache
          cache-to: type=registry,ref=ghcr.io/cdjepeno/ecom-pipeline:buildcache,mode=max
          tags: |
            ghcr.io/cdjepeno/ecom-pipeline:${{ steps.set-tag.outputs.image-tag }}
            ghcr.io/cdjepeno/ecom-pipeline:latest

      - name: Build and push mcp image
        uses: docker/build-push-action@v5
        with:
          context: ./src/mcp
          push: true
          provenance: false
          cache-from: type=registry,ref=ghcr.io/cdjepeno/ecom-mcp:buildcache
          cache-to: type=registry,ref=ghcr.io/cdjepeno/ecom-mcp:buildcache,mode=max
          tags: |
            ghcr.io/cdjepeno/ecom-mcp:${{ steps.set-tag.outputs.image-tag }}
            ghcr.io/cdjepeno/ecom-mcp:latest

      - name: Save image metadata as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-metadata-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/image-tag.txt
          retention-days: 1
      
      - name: Create image tag file
        run: |
          echo "${{ steps.set-tag.outputs.image-tag }}" > ${{ github.workspace }}/image-tag.txt
          echo "${{ github.run_id }}" > ${{ github.workspace }}/ci-run-id.txt

      - name: Notify Slack on success
        if: success() && github.ref == 'refs/heads/pre-prod'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ Images built on *${{ github.repository }}* branch `${{ github.ref_name }}`",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "✅ *5 images built and pushed* on `${{ github.ref_name }}`\n*Author:* ${{ github.actor }}\n*Tag:* `${{ steps.set-tag.outputs.image-tag }}`\n*SHA:* `${{ github.sha }}`\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on failure
        if: failure() && github.ref == 'refs/heads/pre-prod'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ Image build failed on *${{ github.repository }}* branch `${{ github.ref_name }}`",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "❌ *Build failed* on `${{ github.ref_name }}`\n*Author:* ${{ github.actor }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
      
      - name: Output build summary
        run: |
          echo "## Images built 🐳" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| semantic-layer | \`${{ steps.set-tag.outputs.image-tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| fastapi | \`${{ steps.set-tag.outputs.image-tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| pipeline | \`${{ steps.set-tag.outputs.image-tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| mcp | \`${{ steps.set-tag.outputs.image-tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| nextjs | \`${{ steps.set-tag.outputs.image-tag }}\` |" >> $GITHUB_STEP_SUMMARY