name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, pre-prod, main]

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run linter
        run: |
          # Removed --exit-zero — lint failures must actually fail the pipeline
          # All Python services are checked, not just two
          ruff check src/semantic_layer/
          ruff check src/fast_api/
          ruff check src/etl_ecom/
          ruff check src/mcp/

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ CI lint failed on *${{ github.repository }}* branch `${{ github.ref_name }}`",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "❌ *Lint failed* on `${{ github.ref_name }}`\n*Author:* ${{ github.actor }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: lint-and-test  # images are never built if lint fails

    permissions:
      contents: read        # read code only — no write access needed
      packages: write       # push images to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # buildkit driver required for registry cache support
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }} 
      
      - name: Build and push nextjs image
        uses: docker/build-push-action@v5
        with:
          context: ./src/next_js
          push: true
          provenance: false
          cache-from: type=registry,ref=ghcr.io/cdjepeno/ecom-nextjs:buildcache
          cache-to: type=registry,ref=ghcr.io/cdjepeno/ecom-nextjs:buildcache,mode=max
          tags: |
            ghcr.io/cdjepeno/ecom-nextjs:${{ github.sha }}
            ghcr.io/cdjepeno/ecom-nextjs:latest

      - name: Build and push semantic-layer image
        uses: docker/build-push-action@v5
        with:
          context: ./src/semantic_layer
          push: true
          provenance: false
          # Registry cache — torch and poetry layers cached between CI runs
          # First run: slow (downloads torch + all deps)
          # Subsequent runs: fast (reuses cached layers)
          cache-from: type=registry,ref=ghcr.io/cdjepeno/ecom-semantic-layer:buildcache
          cache-to: type=registry,ref=ghcr.io/cdjepeno/ecom-semantic-layer:buildcache,mode=max
          tags: |
            ghcr.io/cdjepeno/ecom-semantic-layer:${{ github.sha }}
            ghcr.io/cdjepeno/ecom-semantic-layer:latest

      - name: Build and push fastapi image
        uses: docker/build-push-action@v5
        with:
          context: ./src/fast_api
          push: true
          provenance: false
          cache-from: type=registry,ref=ghcr.io/cdjepeno/ecom-fastapi:buildcache
          cache-to: type=registry,ref=ghcr.io/cdjepeno/ecom-fastapi:buildcache,mode=max
          tags: |
            ghcr.io/cdjepeno/ecom-fastapi:${{ github.sha }}
            ghcr.io/cdjepeno/ecom-fastapi:latest

      - name: Build and push pipeline image
        uses: docker/build-push-action@v5
        with:
          context: ./src/etl_ecom
          push: true
          provenance: false
          cache-from: type=registry,ref=ghcr.io/cdjepeno/ecom-pipeline:buildcache
          cache-to: type=registry,ref=ghcr.io/cdjepeno/ecom-pipeline:buildcache,mode=max
          tags: |
            ghcr.io/cdjepeno/ecom-pipeline:${{ github.sha }}
            ghcr.io/cdjepeno/ecom-pipeline:latest

      - name: Build and push mcp image
        uses: docker/build-push-action@v5
        with:
          context: ./src/mcp
          push: true
          provenance: false
          cache-from: type=registry,ref=ghcr.io/cdjepeno/ecom-mcp:buildcache
          cache-to: type=registry,ref=ghcr.io/cdjepeno/ecom-mcp:buildcache,mode=max
          tags: |
            ghcr.io/cdjepeno/ecom-mcp:${{ github.sha }}
            ghcr.io/cdjepeno/ecom-mcp:latest

     

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ Images built on *${{ github.repository }}* branch `${{ github.ref_name }}`",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "✅ *5 images built and pushed* on `${{ github.ref_name }}`\n*Author:* ${{ github.actor }}\n*SHA:* `${{ github.sha }}`\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ Image build failed on *${{ github.repository }}* branch `${{ github.ref_name }}`",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "❌ *Build failed* on `${{ github.ref_name }}`\n*Author:* ${{ github.actor }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
      
      - name: Output build summary
        run: |
          echo "## Images built 🐳" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| semantic-layer | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| fastapi | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| pipeline | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| mcp | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| nextjs | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY