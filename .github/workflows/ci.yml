name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, pre-prod, main]

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install poetry
          cd src/semantic_layer && poetry install --no-root
          cd ../fast_api && poetry install --no-root

      - name: Run linter
        run: |
          cd src/semantic_layer && poetry run ruff check .
          cd ../fast_api && poetry run ruff check .

      - name: Run tests
        run: |
          cd tests && python -m pytest . -v --tb=short
        continue-on-error: true  # tests may not exist yet

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: lint-and-test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push semantic-layer image
        uses: docker/build-push-action@v5
        with:
          context: ./src/semantic_layer
          push: true
          build-args: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          tags: |
            ghcr.io/cdjepeno/ecom-semantic-layer:${{ github.sha }}
            ghcr.io/cdjepeno/ecom-semantic-layer:latest

      - name: Build and push fastapi image
        uses: docker/build-push-action@v5
        with:
          context: ./src/fast_api
          push: true
          tags: |
            ghcr.io/cdjepeno/ecom-fastapi:${{ github.sha }}
            ghcr.io/cdjepeno/ecom-fastapi:latest

      - name: Build and push pipeline image
        uses: docker/build-push-action@v5
        with:
          context: ./src/etl_ecom
          push: true
          tags: |
            ghcr.io/cdjepeno/ecom-pipeline:${{ github.sha }}
            ghcr.io/cdjepeno/ecom-pipeline:latest

      - name: Build and push mcp image
        uses: docker/build-push-action@v5
        with:
          context: ./src/mcp
          push: true
          tags: |
            ghcr.io/cdjepeno/ecom-mcp:${{ github.sha }}
            ghcr.io/cdjepeno/ecom-mcp:latest
