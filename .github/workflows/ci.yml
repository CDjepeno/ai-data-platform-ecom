name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, pre-prod, main]

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run linter
        run: |
          ruff check src/semantic_layer/ --exit-zero
          ruff check src/fast_api/ --exit-zero

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ CI lint failed on *${{ github.repository }}* branch `${{ github.ref_name }}`",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "❌ *Lint failed* on `${{ github.ref_name }}`\n*Author:* ${{ github.actor }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: lint-and-test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Use docker driver instead of buildkit
          # avoids "unknown blob" error on large images
          driver: docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push semantic-layer image
        uses: docker/build-push-action@v5
        with:
          context: ./src/semantic_layer
          push: true
          # Use standard docker driver — more reliable for large images
          provenance: false
          build-args: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          tags: |
            ghcr.io/cdjepeno/ecom-semantic-layer:${{ github.sha }}
            ghcr.io/cdjepeno/ecom-semantic-layer:latest

      - name: Build and push fastapi image
        uses: docker/build-push-action@v5
        with:
          context: ./src/fast_api
          push: true
          provenance: false
          tags: |
            ghcr.io/cdjepeno/ecom-fastapi:${{ github.sha }}
            ghcr.io/cdjepeno/ecom-fastapi:latest

      - name: Build and push pipeline image
        uses: docker/build-push-action@v5
        with:
          context: ./src/etl_ecom
          push: true
          provenance: false
          tags: |
            ghcr.io/cdjepeno/ecom-pipeline:${{ github.sha }}
            ghcr.io/cdjepeno/ecom-pipeline:latest

      - name: Build and push mcp image
        uses: docker/build-push-action@v5
        with:
          context: ./src/mcp
          push: true
          provenance: false
          tags: |
            ghcr.io/cdjepeno/ecom-mcp:${{ github.sha }}
            ghcr.io/cdjepeno/ecom-mcp:latest

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ Images built on *${{ github.repository }}* branch `${{ github.ref_name }}`",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "✅ *Images pushed to ghcr.io* on `${{ github.ref_name }}`\n*Author:* ${{ github.actor }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ Image build failed on *${{ github.repository }}* branch `${{ github.ref_name }}`",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "❌ *Docker build failed* on `${{ github.ref_name }}`\n*Author:* ${{ github.actor }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
