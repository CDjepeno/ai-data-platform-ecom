---
name: Deploy Apps

on:
  workflow_run:
    workflows: ["CI"]
    branches: [pre-prod]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (leave empty to use latest CI tag)"
        required: false

concurrency:
  group: deploy-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Apps
    runs-on: ubuntu-latest
    environment: pre-prod

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        id: tag
        run: |
          if [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
            echo "image-tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "Source: manual input"
          else
            echo "image-tag=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
            echo "Source: CI commit SHA"
          fi
          echo "Tag: $(cat $GITHUB_OUTPUT | grep image-tag | cut -d= -f2)"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.35.5"

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PRE_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Ensure namespace exists
        run: |
          kubectl create namespace ecom-preprod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Provision secrets
        run: |
          # GHCR pull secret
          kubectl create secret docker-registry ghcr-secret \
            --namespace ecom-preprod \
            --docker-server=ghcr.io \
            --docker-username=cdjepeno \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --docker-email=djepenodev@gmail.com \
            --dry-run=client -o yaml | kubectl apply -f -

          # OpenAI
          kubectl create secret generic openai-secret \
            --namespace ecom-preprod \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Postgres
          kubectl create secret generic postgres-secret \
            --namespace ecom-preprod \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_HOST="${{ secrets.POSTGRES_HOST }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=POSTGRES_URL="${{ secrets.POSTGRES_URL_PRE_PROD }}" \
            --from-literal=POSTGRES_SSLMODE="require" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Slack (MCP)
          kubectl create secret generic mcp-slack-secret \
            --namespace ecom-preprod \
            --from-literal=SLACK_BOT_TOKEN="${{ secrets.SLACK_BOT_TOKEN }}" \
            --from-literal=SLACK_APP_TOKEN="${{ secrets.SLACK_APP_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # DeepSeek
          kubectl create secret generic deepseek-secret \
            --namespace ecom-preprod \
            --from-literal=DEEP_SEEK_API="${{ secrets.DEEP_SEEK_API }}" \
            --from-literal=BASE_URL_DEEP_SEEK_API="${{ secrets.BASE_URL_DEEP_SEEK_API }}" \
            --from-literal=MODEL_DEEP_SEEK="${{ secrets.MODEL_DEEP_SEEK }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set image tags
        run: |
          TAG="${{ steps.tag.outputs.image-tag }}"
          cd infrastructure/kubernetes/overlays/pre-prod/apps

          kustomize edit set image \
            ghcr.io/cdjepeno/ecom-fastapi=ghcr.io/cdjepeno/ecom-fastapi:${TAG} \
            ghcr.io/cdjepeno/ecom-semantic-layer=ghcr.io/cdjepeno/ecom-semantic-layer:${TAG} \
            ghcr.io/cdjepeno/ecom-nextjs=ghcr.io/cdjepeno/ecom-nextjs:${TAG} \
            ghcr.io/cdjepeno/ecom-mcp=ghcr.io/cdjepeno/ecom-mcp:${TAG} \
            ghcr.io/cdjepeno/ecom-pipeline=ghcr.io/cdjepeno/ecom-pipeline:${TAG}

      - name: Show diff before applying
        run: |
          kubectl diff -k infrastructure/kubernetes/overlays/pre-prod/apps/ || true

      - name: Delete immutable Job before apply
        run: |
          # WHY: Kubernetes Jobs are immutable — kubectl apply fails if the spec changed.
          # Deleting first is safe because the job is re-created immediately after.
          kubectl delete job etl-pipeline \
            --namespace ecom-preprod \
            --ignore-not-found=true

      - name: Deploy apps
        run: |
          kubectl apply -k infrastructure/kubernetes/overlays/pre-prod/apps/

      - name: Wait for rollout
        run: |
          for deploy in fastapi semantic-layer nextjs mcp; do
            echo "Waiting for $deploy..."
            kubectl rollout status deployment/${deploy} \
              --namespace ecom-preprod \
              --timeout=300s
          done

      - name: Show apps status
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ecom-preprod -o wide

          echo ""
          echo "=== Services ==="
          kubectl get svc -n ecom-preprod

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ Apps deployed to pre-prod",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "✅ *Apps deployed to pre-prod*\n*Tag:* `${{ steps.tag.outputs.image-tag }}`\n*Author:* ${{ github.actor }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ Apps deploy to pre-prod failed",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "❌ *Apps deploy failed*\n*Tag:* `${{ steps.tag.outputs.image-tag }}`\n*Author:* ${{ github.actor }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
