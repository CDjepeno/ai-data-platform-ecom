name: Deploy Infra

on:
  push:
    branches:
      - pre-prod
      - feat/kubernetes-terraform-deployment
    paths:
      - 'infrastructure/kubernetes/infra/**'
      - 'infrastructure/kubernetes/overlays/preprod/infra/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

concurrency:
  group: deploy-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Infra
    runs-on: ubuntu-latest

    environment: pre-prod

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.5'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PRE_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Show diff before applying
        run: |
          kubectl diff -k infrastructure/kubernetes/overlays/preprod/infra/ || true

      - name: Deploy infra
        run: |
          kubectl apply -k infrastructure/kubernetes/overlays/preprod/infra/

      - name: Show infra status
        if: always()
        run: |
          kubectl get pods -A