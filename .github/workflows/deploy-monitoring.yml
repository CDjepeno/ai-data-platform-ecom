name: Deploy Monitoring

on:
  workflow_run:
    workflows: ["Deploy to pre-prod"]
    branches: [pre-prod]
    types: [completed]
  
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'

jobs:
  deploy:
    runs-on: ubuntu-latest

     # Same guard pattern as your deploy-pre-prod — only run on success
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PRE_PROD }}" | base64 -d > ~/.kube/config

      - name: Verify cluster
        run: |
          kubectl get nodes
          kubectl get pods -A

      - name: Create monitoring namespace
        run: |
          kubectl create namespace monitoring \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Add Helm repo
        run: |
          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts

          helm repo update

      - name: Deploy monitoring
        run: |
          helm upgrade --install monitoring \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            -f infrastructure/kubernetes/base/monitoring/prometheus-values.yml

      - name: Check pods
        run: |
          kubectl get pods -n monitoring
