name: Deploy Monitoring

on:
  workflow_run:
    workflows: ["CI"]
    branches: [pre-prod]
    types: [completed]
    paths:
      - 'infrastructure/kubernetes/base/monitoring/**'

  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - uses: azure/setup-helm@v4

      - name: Provision Kubernetes secrets
        run: |
          # Cloudflare API token for cert-manager DNS-01 challenge
          kubectl create secret generic cloudflare-api-token \
            --namespace cert-manager \
            --from-literal=api-token="${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f 

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PRE_PROD }}" | base64 -d > ~/.kube/config

      - name: Verify cluster
        run: |
          kubectl get nodes
          kubectl get pods -A

      - name: Create monitoring namespace
        run: |
          kubectl create namespace monitoring \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Add Helm repo
        run: |
          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Deploy monitoring
        run: |
          helm upgrade --install monitoring \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            -f infrastructure/kubernetes/base/monitoring/prometheus-values.yml

      - name: Apply Grafana ingress
        run: |
          kubectl apply -f infrastructure/kubernetes/base/monitoring/

      - name: Check pods
        run: |
          kubectl get pods -n monitoring
