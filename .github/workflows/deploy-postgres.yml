
---
name: Deploy PostgreSQL

on:
  push:
    branches:
      - pre-prod
    paths:
      - 'infrastructure/kubernetes/overlays/pre-prod/postgres-cluster.yaml'
      - 'infrastructure/kubernetes/base/postgres/**'

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy PostgreSQL Cluster
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PRE_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get ns

      - name: Verify CloudNativePG operator
        run: |
          kubectl get pods -n cnpg-system

      - name: Verify PostgreSQL namespace
        run: |
          kubectl get namespace postgres

      - name: Deploy PostgreSQL cluster
        run: |
          kubectl apply \
            -f infrastructure/kubernetes/overlays/pre-prod/postgres-cluster.yaml

      - name: Wait for PostgreSQL cluster
        run: |
          kubectl wait \
            --for=condition=Ready \
            cluster/postgres-source \
            -n postgres \
            --timeout=600s

      - name: Show PostgreSQL status
        run: |
          kubectl get cluster -n postgres

          kubectl get pods \
            -n postgres \
            -o wide

          kubectl get pvc \
            -n postgres

          kubectl get svc \
            -n postgres