name: Deploy to pre-prod

on:
  push:
    branches: [pre-prod]

jobs:
  deploy:
    name: Deploy to Kubernetes pre-prod
    runs-on: ubuntu-latest
    environment: pre-prod

    permissions:
      contents: read    # read code only — write was too broad, deploy never pushes commits
      packages: read    # pull images from GHCR — write not needed here, ci.yml handles pushing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images are already built and pushed by ci.yml with the same SHA
      # No rebuild here — single source of truth for artifacts

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.32.0"   # matches cluster version — skew > 1 minor version is unsupported

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PRE_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connection
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Create namespace if not exists
        run: |
          # --dry-run=client -o yaml | kubectl apply -f - is idempotent
          # Safe to run on every deploy — no error if namespace already exists
          kubectl create namespace ecom-pre-prod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Provision Kubernetes secrets
        run: |
          # All secrets use --dry-run=client | kubectl apply pattern
          # This is idempotent — updates existing secrets, creates missing ones

          # GHCR pull secret — name must match imagePullSecrets in kustomization
          kubectl create secret docker-registry ghcr-secret \
            --namespace ecom-pre-prod \
            --docker-server=ghcr.io \
            --docker-username=cdjepeno \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --docker-email=djepenodev@gmail.com \
            --dry-run=client -o yaml | kubectl apply -f -

          # OpenAI
          kubectl create secret generic openai-secret \
            --namespace ecom-pre-prod \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Postgres — OVH Managed PostgreSQL
          kubectl create secret generic postgres-secret \
            --namespace ecom-pre-prod \
            --from-literal=POSTGRES_HOST="${{ secrets.POSTGRES_HOST }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=POSTGRES_URL="${{ secrets.POSTGRES_URL_PRE_PROD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # ETL — OVH Object Storage credentials
          kubectl create secret generic etl-secret \
            --namespace ecom-pre-prod \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # MCP Slack gateway
          kubectl create secret generic mcp-slack-secret \
            --namespace ecom-pre-prod \
            --from-literal=SLACK_BOT_TOKEN="${{ secrets.SLACK_BOT_TOKEN }}" \
            --from-literal=SLACK_APP_TOKEN="${{ secrets.SLACK_APP_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # MinIO/S3 — OVH Object Storage warehouse
          kubectl create secret generic minio-secret \
            --namespace ecom-pre-prod \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --from-literal=WAREHOUSE_ENDPOINT="${{ secrets.WAREHOUSE_ENDPOINT }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # DeepSeek LLM
          kubectl create secret generic deepseek-secret \
            --namespace ecom-pre-prod \
            --from-literal=api_key="${{ secrets.DEEP_SEEK_API }}" \
            --from-literal=base_url="${{ secrets.BASE_URL_DEEP_SEEK_API }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # HuggingFace — embedding models
          kubectl create secret generic hf-secret \
            --namespace ecom-pre-prod \
            --from-literal=token="${{ secrets.HF_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update image tags in Kustomize overlay
        run: |
          cd infrastructure/kubernetes/overlays/pre-prod
          SHA=${{ github.sha }}

          # Reference images already pushed by ci.yml — never rebuild in deploy
          # SHA tag guarantees we deploy exactly what was built and tested
          kustomize edit set image \
            ghcr.io/cdjepeno/ecom-semantic-layer=ghcr.io/cdjepeno/ecom-semantic-layer:${SHA} \
            ghcr.io/cdjepeno/ecom-fastapi=ghcr.io/cdjepeno/ecom-fastapi:${SHA} \
            ghcr.io/cdjepeno/ecom-pipeline=ghcr.io/cdjepeno/ecom-pipeline:${SHA} \
            ghcr.io/cdjepeno/ecom-mcp=ghcr.io/cdjepeno/ecom-mcp:${SHA} \
            ghcr.io/cdjepeno/ecom-nextjs=ghcr.io/cdjepeno/ecom-nextjs:${SHA}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -k infrastructure/kubernetes/overlays/pre-prod
          
          # Wait for all deployments to roll out successfully
          # Fails the pipeline if any deployment does not become ready within 5 minutes
          kubectl rollout status deployment \
            --namespace ecom-pre-prod \
            --timeout=300s

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ Deployed to pre-prod",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "✅ *Deployed to pre-prod* on `${{ github.ref_name }}`\n*Author:* ${{ github.actor }}\n*SHA:* `${{ github.sha }}`\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ Deploy to pre-prod failed",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "❌ *Deploy failed* on `${{ github.ref_name }}`\n*Author:* ${{ github.actor }}\n*SHA:* `${{ github.sha }}`\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK