name: Deploy to pre-prod

on:
  push:
    branches: [pre-prod]

jobs:
  deploy:
    name: Deploy to Kubernetes pre-prod
    runs-on: ubuntu-latest
    environment: pre-prod  # requires manual approval in GitHub

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pre-prod images
        run: |
          # Semantic layer — model loaded at runtime from PVC
          docker build \
            -t ghcr.io/cdjepeno/ecom-semantic-layer:${{ github.sha }} \
            -t ghcr.io/cdjepeno/ecom-semantic-layer:pre-prod \
            ./src/semantic_layer
          docker push ghcr.io/cdjepeno/ecom-semantic-layer:${{ github.sha }}
          docker push ghcr.io/cdjepeno/ecom-semantic-layer:pre-prod

          # FastAPI
          docker build \
            -t ghcr.io/cdjepeno/ecom-fastapi:${{ github.sha }} \
            -t ghcr.io/cdjepeno/ecom-fastapi:pre-prod \
            ./src/fast_api
          docker push ghcr.io/cdjepeno/ecom-fastapi:${{ github.sha }}
          docker push ghcr.io/cdjepeno/ecom-fastapi:pre-prod

          # Pipeline
          docker build \
            -t ghcr.io/cdjepeno/ecom-pipeline:${{ github.sha }} \
            -t ghcr.io/cdjepeno/ecom-pipeline:pre-prod \
            ./src/etl_ecom
          docker push ghcr.io/cdjepeno/ecom-pipeline:${{ github.sha }}
          docker push ghcr.io/cdjepeno/ecom-pipeline:pre-prod

          # MCP
          docker build \
            -t ghcr.io/cdjepeno/ecom-mcp:${{ github.sha }} \
            -t ghcr.io/cdjepeno/ecom-mcp:pre-prod \
            ./src/mcp
          docker push ghcr.io/cdjepeno/ecom-mcp:${{ github.sha }}
          docker push ghcr.io/cdjepeno/ecom-mcp:pre-prod

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.31.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PRE_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connection
        run: kubectl get nodes

      - name: Update image tags in overlays
        run: |
          sed -i "s|ghcr.io/cdjepeno/ecom-semantic-layer:.*|ghcr.io/cdjepeno/ecom-semantic-layer:${{ github.sha }}|g" \
            infrastructure/kubernetes/overlays/pre-prod/kustomization.yml

          sed -i "s|ghcr.io/cdjepeno/ecom-fastapi:.*|ghcr.io/cdjepeno/ecom-fastapi:${{ github.sha }}|g" \
            infrastructure/kubernetes/overlays/pre-prod/kustomization.yml

          sed -i "s|ghcr.io/cdjepeno/ecom-pipeline:.*|ghcr.io/cdjepeno/ecom-pipeline:${{ github.sha }}|g" \
            infrastructure/kubernetes/overlays/pre-prod/kustomization.yml

          sed -i "s|ghcr.io/cdjepeno/ecom-mcp:.*|ghcr.io/cdjepeno/ecom-mcp:${{ github.sha }}|g" \
            infrastructure/kubernetes/overlays/pre-prod/kustomization.yml

      - name: Deploy to Kubernetes pre-prod
        run: |
          kubectl apply -k infrastructure/kubernetes/overlays/pre-prod/

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/fastapi -n ecom-pre-prod --timeout=180s
          kubectl rollout status deployment/semantic-layer -n ecom-pre-prod --timeout=180s
          kubectl rollout status deployment/mcp -n ecom-pre-prod --timeout=180s
          kubectl rollout status statefulset/nessie -n ecom-pre-prod --timeout=180s
          kubectl get pods -n ecom-pre-prod

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ Pre-prod deployment succeeded on *${{ github.repository }}*",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "✅ *Deployed to Kubernetes pre-prod* — `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ Pre-prod deployment failed on *${{ github.repository }}*",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "❌ *Deployment to Kubernetes pre-prod failed* — `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK