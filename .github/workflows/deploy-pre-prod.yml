name: Deploy to pre-prod

on:
  push:
    branches: [pre-prod]

jobs:
  deploy:
    name: Deploy to Kubernetes pre-prod
    runs-on: ubuntu-latest
    environment: pre-prod

    permissions:
      contents: write   # needed to commit kustomize image tag update
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pre-prod images
        run: |
          # Semantic layer — model loaded at runtime from PVC, no HF_TOKEN at build time
          docker build \
            -t ghcr.io/cdjepeno/ecom-semantic-layer:${{ github.sha }} \
            -t ghcr.io/cdjepeno/ecom-semantic-layer:pre-prod \
            ./src/semantic_layer
          docker push ghcr.io/cdjepeno/ecom-semantic-layer:${{ github.sha }}
          docker push ghcr.io/cdjepeno/ecom-semantic-layer:pre-prod

          # FastAPI
          docker build \
            -t ghcr.io/cdjepeno/ecom-fastapi:${{ github.sha }} \
            -t ghcr.io/cdjepeno/ecom-fastapi:pre-prod \
            ./src/fast_api
          docker push ghcr.io/cdjepeno/ecom-fastapi:${{ github.sha }}
          docker push ghcr.io/cdjepeno/ecom-fastapi:pre-prod

          # Pipeline
          docker build \
            -t ghcr.io/cdjepeno/ecom-pipeline:${{ github.sha }} \
            -t ghcr.io/cdjepeno/ecom-pipeline:pre-prod \
            ./src/etl_ecom
          docker push ghcr.io/cdjepeno/ecom-pipeline:${{ github.sha }}
          docker push ghcr.io/cdjepeno/ecom-pipeline:pre-prod

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.31.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PRE_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connection
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Provision Kubernetes secrets
        run: |
          # GHCR pull secret
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace ecom-pre-prod \
            --docker-server=ghcr.io \
            --docker-username=cdjepeno \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --docker-email=djepenodev@gmail.com \
            --dry-run=client -o yaml | kubectl apply -f -

          # DeepSeek secret
          kubectl create secret generic deepseek-secret \
            --namespace ecom-pre-prod \
            --from-literal=api_key="${{ secrets.DEEP_SEEK_API }}" \
            --from-literal=base_url="${{ secrets.BASE_URL_DEEP_SEEK_API }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # HuggingFace secret — runtime only, not build time
          kubectl create secret generic hf-secret \
            --namespace ecom-pre-prod \
            --from-literal=token="${{ secrets.HF_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Warehouse S3 secret
          kubectl create secret generic warehouse-s3-secret \
            --namespace ecom-pre-prod \
            --from-literal=access_key="${{ secrets.WAREHOUSE_ACCESS_KEY }}" \
            --from-literal=secret_key="${{ secrets.WAREHOUSE_SECRET_KEY }}" \
            --from-literal=endpoint="${{ secrets.WAREHOUSE_ENDPOINT }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update image tags in Kustomize overlay
        run: |
          cd infrastructure/kubernetes/overlays/pre-prod
          kustomize edit set image \
            ghcr.io/cdjepeno/ecom-semantic-layer=ghcr.io/cdjepeno/ecom-semantic-layer:${{ github.sha }}
          kustomize edit set image \
            ghcr.io/cdjepeno/ecom-fastapi=ghcr.io/cdjepeno/ecom-fastapi:${{ github.sha }}
          kustomize edit set image \
            ghcr.io/cdjepeno/ecom-pipeline=ghcr.io/cdjepeno/ecom-pipeline:${{ github.sha }}

      - name: Commit updated image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/kubernetes/overlays/pre-prod/kustomization.yml
          git diff --staged --quiet || git commit -m "ci: update pre-prod image tags to ${{ github.sha }}"
          git push

      - name: Deploy to Kubernetes pre-prod
        run: |
          kubectl apply -k infrastructure/kubernetes/overlays/pre-prod/

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/fastapi \
            -n ecom-pre-prod --timeout=300s
          kubectl rollout status deployment/semantic-layer \
            -n ecom-pre-prod --timeout=300s
          kubectl rollout status statefulset/nessie \
            -n ecom-pre-prod --timeout=300s
          kubectl get pods -n ecom-pre-prod

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ Pre-prod deployment succeeded on *${{ github.repository }}*",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "✅ *Deployed to Kubernetes pre-prod* — `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ Pre-prod deployment failed on *${{ github.repository }}*",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "❌ *Deployment to Kubernetes pre-prod failed* — `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK