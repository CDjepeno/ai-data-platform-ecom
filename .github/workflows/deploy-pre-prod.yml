name: Deploy to pre-prod

on:
  workflow_run:
    workflows: ["CI"]
    branches: [pre-prod]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Kubernetes pre-prod
    runs-on: ubuntu-latest
    environment: pre-prod

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download CI metadata
        uses: actions/download-artifact@v4
        with:
          pattern: ci-metadata-*
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          merge-multiple: true

      - name: Read image tag
        id: read-tag
        run: |
          if [[ -f "image-tag.txt" ]]; then
            IMAGE_TAG=$(cat image-tag.txt)
            echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
            echo "Using image tag from CI: $IMAGE_TAG"
          else
            # Fallback to workflow_run head_sha if artifact not found
            IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
            echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
            echo "⚠️  Artifact not found, using workflow_run.head_sha: $IMAGE_TAG"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify images exist in GHCR
        run: |
          TAG="${{ steps.read-tag.outputs.image-tag }}"
          echo "🔍 Verifying images with tag: $TAG"
          
          MISSING_IMAGES=""
          
          for image in \
            "ghcr.io/cdjepeno/ecom-semantic-layer:${TAG}" \
            "ghcr.io/cdjepeno/ecom-fastapi:${TAG}" \
            "ghcr.io/cdjepeno/ecom-pipeline:${TAG}" \
            "ghcr.io/cdjepeno/ecom-mcp:${TAG}" \
            # "ghcr.io/cdjepeno/ecom-nextjs:${TAG}"; do
            
            echo -n "Checking $image ... "
            
            if docker manifest inspect ${image} > /dev/null 2>&1; then
              echo "✅ FOUND"
            else
              echo "❌ MISSING"
              MISSING_IMAGES="${MISSING_IMAGES}\n  - ${image}"
            fi
          done
          
          if [[ -n "$MISSING_IMAGES" ]]; then
            echo "❌ Images not found:${MISSING_IMAGES}"
            echo ""
            echo "💡 Possible causes:"
            echo "   1. CI workflow hasn't completed successfully on branch pre-prod"
            echo "   2. CI workflow used a different tag format"
            echo "   3. Images were not pushed to GHCR"
            echo ""
            echo "🔧 To fix:"
            echo "   - Check CI workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
            echo "   - Or trigger a new CI run on pre-prod branch"
            exit 1
          fi
          
          echo ""
          echo "✅ All 5 images verified successfully!"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.32.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PRE_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connection
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ecom-pre-prod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Provision Kubernetes secrets
        run: |
          # GHCR pull secret
          kubectl create secret docker-registry ghcr-secret \
            --namespace ecom-pre-prod \
            --docker-server=ghcr.io \
            --docker-username=cdjepeno \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --docker-email=djepenodev@gmail.com \
            --dry-run=client -o yaml | kubectl apply -f -

          # OpenAI
          kubectl create secret generic openai-secret \
            --namespace ecom-pre-prod \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Postgres
          kubectl create secret generic postgres-secret \
            --namespace ecom-pre-prod \
            --from-literal=POSTGRES_HOST="${{ secrets.POSTGRES_HOST }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=POSTGRES_URL="${{ secrets.POSTGRES_URL_PRE_PROD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # ETL
          kubectl create secret generic etl-secret \
            --namespace ecom-pre-prod \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # MCP Slack
          kubectl create secret generic mcp-slack-secret \
            --namespace ecom-pre-prod \
            --from-literal=SLACK_BOT_TOKEN="${{ secrets.SLACK_BOT_TOKEN }}" \
            --from-literal=SLACK_APP_TOKEN="${{ secrets.SLACK_APP_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # MinIO/S3
          kubectl create secret generic minio-secret \
            --namespace ecom-pre-prod \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --from-literal=WAREHOUSE_ENDPOINT="${{ secrets.WAREHOUSE_ENDPOINT }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # DeepSeek
          kubectl create secret generic deepseek-secret \
            --namespace ecom-pre-prod \
            --from-literal=DEEP_SEEK_API="${{ secrets.DEEP_SEEK_API }}" \
            --from-literal=BASE_URL_DEEP_SEEK_API="${{ secrets.BASE_URL_DEEP_SEEK_API }}" \
            --from-literal=MODEL_DEEP_SEEK="${{ secrets.MODEL_DEEP_SEEK }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # HuggingFace
          kubectl create secret generic hf-secret \
            --namespace ecom-pre-prod \
            --from-literal=token="${{ secrets.HF_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update tags and deploy
        run: |
          TAG="${{ steps.read-tag.outputs.image-tag }}"
          OVERLAY="infrastructure/kubernetes/overlays/pre-prod"
          
          echo "📦 Deploying with image tag: $TAG"
          
          cd $GITHUB_WORKSPACE/${OVERLAY}
          
          # Show current images before update
          echo "Current images in kustomization:"
          grep -A5 "images:" kustomization.yml || echo "No images section found"
          
          # Update images
          kustomize edit set image \
            ghcr.io/cdjepeno/ecom-fastapi=ghcr.io/cdjepeno/ecom-fastapi:${TAG} \
            ghcr.io/cdjepeno/ecom-semantic-layer=ghcr.io/cdjepeno/ecom-semantic-layer:${TAG} \
            ghcr.io/cdjepeno/ecom-nextjs=ghcr.io/cdjepeno/ecom-nextjs:${TAG} \
            ghcr.io/cdjepeno/ecom-mcp=ghcr.io/cdjepeno/ecom-mcp:${TAG} \
            ghcr.io/cdjepeno/ecom-pipeline=ghcr.io/cdjepeno/ecom-pipeline:${TAG}
          
          # Verify mutation
          echo ""
          echo "Updated images in kustomization:"
          grep -A5 "images:" kustomization.yml
          
          # Apply
          cd $GITHUB_WORKSPACE
          kubectl apply -k ${OVERLAY}
          
          # Wait for rollout
          kubectl rollout status deployment \
            --namespace ecom-pre-prod \
            --timeout=300s

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ Deployed to pre-prod",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "✅ *Deployed to pre-prod* on `${{ github.ref_name }}`\n*Tag:* `${{ steps.read-tag.outputs.image-tag }}`\n*Author:* ${{ github.actor }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ Deploy to pre-prod failed",
              "blocks": [{"type": "section","text": {"type": "mrkdwn","text": "❌ *Deploy failed* on `${{ github.ref_name }}`\n*Tag:* `${{ steps.read-tag.outputs.image-tag }}`\n*Author:* ${{ github.actor }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>*"}}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

    
