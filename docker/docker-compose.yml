name: ecom-data-platform-dev

services:

  postgres:
    image: postgres:15
    env_file:
      - .env
    ports:
    # host:container -> 5433 (machine) vers 5432 (postgres container)
      - "5434:5432"
    volumes:
        - postgres_data_dev:/var/lib/postgresql/data
        - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - etl_ecom
    
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"     
      - "9001:9001"     
    env_file:
      - .env         
    volumes:
      - minio_data_dev:/data
    command: server /data --console-address ":9001"
    networks:
      - etl_ecom

  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: nessie

    ports:
      - "19120:19120"

    environment:
      - QUARKUS_HTTP_PORT=19120

      # =========================
      # ICEBERG REST
      # =========================

      - nessie.catalog.default-warehouse=warehouse

      - nessie.catalog.warehouses.warehouse.location=s3://ecom-etl/warehouse

      # =========================
      # MINIO
      # =========================

      - nessie.catalog.service.s3.default-options.endpoint=http://minio:9000
      - nessie.catalog.service.s3.default-options.path-style-access=true
      - nessie.catalog.service.s3.default-options.region=us-east-1

      # 🔥 IMPORTANT
      - nessie.catalog.service.s3.default-options.auth-type=application-global

      # GLOBAL AWS CREDS
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_REGION=us-east-1
      - nessie.version.store.type=ROCKSDB
      - nessie.version.store.persist.directory=/nessie-data
    
    volumes:
      - ../data/nessie:/nessie-data

    networks:
      - etl_ecom



  pipeline:
    build: 
      context: ..
    depends_on:
      postgres:
        condition: service_healthy   
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - etl_ecom
    

volumes:
  minio_data_dev: 
  postgres_data_dev:

networks:
  etl_ecom: