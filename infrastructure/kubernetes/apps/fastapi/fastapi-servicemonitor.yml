apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fastapi
  namespace: monitoring    # must be in monitoring namespace
  labels:
    release: monitoring    # must match Prometheus operator selector
spec:
  namespaceSelector:
    matchNames:
      - ecom-local
  selector:
    matchLabels:
      app: fastapi
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
