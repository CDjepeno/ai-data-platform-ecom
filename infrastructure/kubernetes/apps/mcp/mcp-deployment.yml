# base/mcp/mcp-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  labels:
    app: mcp
    component: ai-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
        component: ai-gateway
    spec:
      containers:
        - name: mcp
          # [NOTE] build locally: docker build -t ecom-mcp:local src/mcp/
          image: ghcr.io/cdjepeno/ecom-mcp    
          imagePullPolicy: Never        # use local Kind image, never pull from registry
          ports:
            - containerPort: 8001
              name: http
          # Config and Slack tokens injected from ConfigMap and Secret
          envFrom:
            - configMapRef:
                name: ecom-config
            - secretRef:
                name: mcp-slack-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
