# base/fastapi/fastapi-ingress.yml
# Exposes FastAPI through ingress so the browser can reach it.
# Browser calls http://chat.local:8080/api/* → fastapi service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastapi
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: chat.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: fastapi
                port:
                  number: 8000
