apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog
  labels:
    app: trino
    component: sql-engine
data:
  # Iceberg catalog — production version
  # Changes from local:
  #   nessie URI    → http://nessie:19120 (same — K8s service name)
  #   warehouse dir → s3://ecom-platform-warehouse-dev/warehouse
  #   s3 endpoint   → https://s3.gra.io.cloud.ovh.net (OVH instead of MinIO)
  #   s3 region     → gra (OVH instead of us-east-1)
  #   credentials   → injected from secret (not hardcoded)
  iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=nessie
    iceberg.nessie-catalog.uri=http://nessie:19120/api/v1
    iceberg.nessie-catalog.ref=main
    iceberg.nessie-catalog.default-warehouse-dir=s3://ecom-platform-warehouse-dev/warehouse
    fs.native-s3.enabled=true
    s3.endpoint=https://s3.gra.io.cloud.ovh.net
    s3.path-style-access=true
    s3.region=gra
