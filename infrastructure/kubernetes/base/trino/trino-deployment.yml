apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  labels:
    app: trino
    component: sql-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
  template:
    metadata:
      labels:
        app: trino
        component: sql-engine
    spec:
      containers:
        - name: trino
          image: trinodb/trino:435
          ports:
            - containerPort: 8080
              name: http

          envFrom:
            - configMapRef:
                name: ecom-config

          env:
            # S3 credentials injected from secret — never hardcoded
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: AWS_SECRET_ACCESS_KEY

          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            # Mount catalog config from ConfigMap
            # Same path as Docker Compose: ./trino/catalog → /etc/trino/catalog
            - name: catalog-config
              mountPath: /etc/trino/catalog
          readinessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: catalog-config
          configMap:
            name: trino-catalog
