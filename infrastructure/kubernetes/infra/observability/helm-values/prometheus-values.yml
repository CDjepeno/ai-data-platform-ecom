
grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password          # override via Secret in prod
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.ecom.local
  # Preload dashboards automatically
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          folder: "Ecom Platform"
          type: file
          options:
            path: /var/lib/grafana/dashboards/default
  additionalDataSources:
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.ecom-local.svc.cluster.local:3200
      access: proxy
      jsonData:
        tracesToMetrics:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true

prometheus:
  enabled: true
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    additionalScrapeConfigs:
      - job_name: otel-collector
        static_configs:
          - targets: ['otel-collector-opentelemetry-collector.ecom-local:8889']
        metrics_path: /metrics

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace"]
      receiver: slack-data-alert
    receivers:
      - name: slack-data-alert
        slack_configs:
          - api_url: "${SLACK_WEBHOOK_URL}"   # injected from secret
            channel: "#data-alert"
            title: "{{ .GroupLabels.alertname }}"
            text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"

# Reduce resource usage for local Kind
kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

# Disable components not needed locally
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
