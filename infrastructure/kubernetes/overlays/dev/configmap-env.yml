apiVersion: v1
kind: ConfigMap
metadata:
  name: ecom-config
  namespace: ecom-dev
data:
  # Trino
  TRINO_HOST: "trino"
  TRINO_PORT: "8080"
  TRINO_USER: "trino"
  TRINO_CATALOG: "iceberg"
  TRINO_SCHEMA: "mart"

  # Nessie
  NESSIE_URI: "http://nessie:19120"
  ICEBERG_WAREHOUSE: "s3://ecom-platform-warehouse-dev/warehouse"

  # Qdrant
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: "semantic_layer"
  QDRANT_SIZE: "384"

  # Valkey
  VALKEY_HOST: "valkey"
  VALKEY_PORT: "6379"
  VALKEY_TTL: "3600"

  # App config
  LOG_LEVEL: "INFO"
  JSON_LOGS: "false"
  MCP_HTTP_TIMEOUT: "60.0"
