apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecom-dev

resources:
  - namespace.yml
  - configmap-env.yml
  - ../../base/valkey/
  - ../../base/qdrant/
  - ../../base/nessie/
  - ../../base/trino/
  - ../../base/semantic-layer/
  - ../../base/fastapi/
  - ../../base/nextjs/

# Dev always uses :latest loaded via `kind load docker-image`
# Never pin tags in dev — you want your last local build
images:
  - name: ghcr.io/cdjepeno/ecom-fastapi
    newTag: "latest"
  - name: ghcr.io/cdjepeno/ecom-semantic-layer
    newTag: "latest"
  - name: ghcr.io/cdjepeno/ecom-nextjs
    newTag: "latest"

patches:
  # Single replica for every Deployment in dev — saves RAM on your machine
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fastapi
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: fastapi

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nextjs
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: nextjs

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: semantic-layer
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: semantic-layer
        
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: ingress-nginx-controller
        namespace: ingress-nginx
      spec:
        type: NodePort
    target:
      kind: Service
      name: ingress-nginx-controller
      namespace: ingress-nginx
