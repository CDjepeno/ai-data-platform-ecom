# ─────────────────────────────────────
# EXECUTOR
# ─────────────────────────────────────
executor: LocalExecutor

# ─────────────────────────────────────
# CUSTOM IMAGE — etl_ecom installed
# ─────────────────────────────────────
images:
  airflow:
    repository: airflow-ecom
    tag: local
    pullPolicy: Never

# ─────────────────────────────────────
# DAGs — local PVC mount
# ─────────────────────────────────────
dags:
  gitSync:
    enabled: false
    recommendedProbeSetting: false

# ─────────────────────────────────────
# SCHEDULER — mounts dags PVC
# ─────────────────────────────────────
scheduler:
  waitForMigrations:
    enabled: true
  extraVolumes:
    - name: local-dags
      persistentVolumeClaim:
        claimName: airflow-dags-pvc
  extraVolumeMounts:
    - name: local-dags
      mountPath: /opt/airflow/dags

# ─────────────────────────────────────
# DAG PROCESSOR — scans and parses DAG files
# ─────────────────────────────────────
dagProcessor:
  extraVolumes:
    - name: local-dags
      persistentVolumeClaim:
        claimName: airflow-dags-pvc
  extraVolumeMounts:
    - name: local-dags
      mountPath: /opt/airflow/dags

# ─────────────────────────────────────
# TRIGGERER
# ─────────────────────────────────────
triggerer:
  waitForMigrations:
    enabled: true

# ─────────────────────────────────────
# WEBSERVER
# ─────────────────────────────────────
createUserJob:
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    email: djepenodev@gmail.com
    password: admin

# ─────────────────────────────────────
# METADATA DB — bundled PostgreSQL
# ─────────────────────────────────────
postgresql:
  enabled: true

# ─────────────────────────────────────
# MISC
# ─────────────────────────────────────
config:
  core:
    load_examples: "False"

# ─────────────────────────────────────
# SECRETS
# ─────────────────────────────────────
secret:
  - envName: "POSTGRES_DB"
    secretName: "postgres-secret"
    secretKey: "POSTGRES_DB"
  - envName: "POSTGRES_USER"
    secretName: "postgres-secret"
    secretKey: "POSTGRES_USER"
  - envName: "POSTGRES_PASSWORD"
    secretName: "postgres-secret"
    secretKey: "POSTGRES_PASSWORD"
  - envName: "POSTGRES_HOST"
    secretName: "postgres-secret"
    secretKey: "POSTGRES_HOST"
  - envName: "POSTGRES_PORT"
    secretName: "postgres-secret"
    secretKey: "POSTGRES_PORT"
  - envName: "MINIO_ENDPOINT"
    secretName: "minio-secret"
    secretKey: "MINIO_ENDPOINT"
  - envName: "MINIO_ROOT_USER"
    secretName: "minio-secret"
    secretKey: "MINIO_ROOT_USER"
  - envName: "MINIO_ROOT_PASSWORD"
    secretName: "minio-secret"
    secretKey: "MINIO_ROOT_PASSWORD"
  - envName: "AWS_ACCESS_KEY_ID"
    secretName: "minio-secret"
    secretKey: "AWS_ACCESS_KEY_ID"
  - envName: "AWS_SECRET_ACCESS_KEY"
    secretName: "minio-secret"
    secretKey: "AWS_SECRET_ACCESS_KEY"
  - envName: "SEMANTIC_LAYER_URL"
    secretName: "etl-secret"
    secretKey: "SEMANTIC_LAYER_URL"
  - envName: "NESSIE_URI"
    secretName: "etl-secret"
    secretKey: "NESSIE_URI"
  - envName: "ICEBERG_WAREHOUSE"
    secretName: "etl-secret"
    secretKey: "ICEBERG_WAREHOUSE"
  - envName: "MINIO_BUCKET"
    secretName: "minio-secret"
    secretKey: "MINIO_BUCKET"
  - envName: "MINIO_REGION"
    secretName: "minio-secret"
    secretKey: "MINIO_REGION"

# ─────────────────────────────────────
# GLOBAL ENV
# ─────────────────────────────────────
env:
  - name: AIRFLOW__DATABASE__MIGRATION_WAIT_TIMEOUT
    value: "300"
  - name: PYTHONPATH
    value: "/opt/etl_ecom"

# ─────────────────────────────────────
# INGRESS
# ─────────────────────────────────────
ingress:
  apiServer:
    enabled: true
    ingressClassName: nginx
    hosts:
      - name: airflow.ecom.local
        tls:
          enabled: false
    pathType: Prefix

extraHosts:
  - ip: "172.18.0.1"  # replace with your actual gateway IP
    hostnames:
      - "host.docker.internal"