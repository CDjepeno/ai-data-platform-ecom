apiVersion: v1
kind: ConfigMap
metadata:
  name: ecom-config

data:
  # -- Trino
  TRINO_HOST: "trino.ecom-local.svc.cluster.local"
  TRINO_PORT: "8080"
  TRINO_USER: "trino"
  TRINO_CATALOG: "iceberg"
  TRINO_SCHEMA: "iceberg"

  # -- Nessie
  NESSIE_URI: "http://nessie.ecom-local.svc.cluster.local:19120/iceberg"
  ICEBERG_WAREHOUSE: "s3://ecom-etl/warehouse"

  # -- Nessie S3/catalog config (moved from statefulset hardcoded values)
  NESSIE_CATALOG_DEFAULT_WAREHOUSE: "warehouse"
  NESSIE_CATALOG_WAREHOUSES_WAREHOUSE_LOCATION: "s3://ecom-etl/warehouse"
  NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ENDPOINT: "http://minio.ecom-local.svc.cluster.local:9000"
  NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_PATH_STYLE_ACCESS: "true"
  NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REGION: "us-east-1"
  NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_AUTH_TYPE: "APPLICATION_GLOBAL"
  NESSIE_VERSION_STORE_TYPE: "ROCKSDB"
  NESSIE_VERSION_STORE_PERSIST_ROCKSDB_DATABASE_PATH: "/nessie-data"
  AWS_REGION: "us-east-1"

  # -- Qdrant
  QDRANT_HOST: "qdrant.ecom-local.svc.cluster.local"
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: "semantic_models"
  QDRANT_SIZE: "1536"

  # -- Embedding model
  MODEL_EMBEDDING: "text-embedding-3-small"

  # -- Valkey
  VALKEY_HOST: "valkey.ecom-local.svc.cluster.local"
  VALKEY_PORT: "6379"
  VALKEY_TTL: "3600"

  # -- MinIO
  MINIO_ENDPOINT: "http://minio.ecom-local.svc.cluster.local:9000"
  MINIO_BUCKET: "ecom-etl"              

  # -- Postgres
  POSTGRES_HOST: "postgres.ecom-local.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "ecom_db"

  # -- MCP
  # FASTAPI_BASE_URL: "https://api.preprod.djepenodev.ink"
  MCP_TRANSPORT: "sse"
  FASTAPI_BASE_URL: "http://fastapi.ecom-local.svc.cluster.local:8000"

  # -- App config
  LOG_LEVEL: "WARNING"
  JSON_LOGS: "true"
  MCP_HTTP_TIMEOUT: "60.0"
  NEXT_PUBLIC_API_URL: "http://chat.local:8080/api"
  QUARKUS_HTTP_PORT: "19120"

  SEMANTIC_MODELS_PATH: "/app/transformations/models/mart/semantic_models"
  METRICS_PATH: "/app/transformations/models/metrics"
