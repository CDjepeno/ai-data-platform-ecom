kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    # Map host ports so ingress-nginx NodePort is reachable from your browser
    extraPortMappings:
      - containerPort: 80
        hostPort: 8888
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
    # Patch ingress-nginx to bind to this node via label
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=data"

  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=app"
