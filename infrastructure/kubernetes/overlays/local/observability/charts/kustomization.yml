# overlays/local/charts/kustomization.yml
# Separate kustomization for Helm charts — no global namespace override
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: kube-prometheus-stack
    valuesFile: ../../../infra/observability/helm-values/prometheus-values.yml
    repo: https://prometheus-community.github.io/helm-charts
    version: "65.1.1"
    releaseName: monitoring
    namespace: monitoring
    includeCRDs: true
