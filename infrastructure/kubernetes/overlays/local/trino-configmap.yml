apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog
  namespace: ecom-local
data:
  iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=nessie

    # v2 is the current Nessie API; v1 is legacy
    iceberg.nessie-catalog.uri=http://nessie:19120/api/v1
    iceberg.nessie-catalog.ref=main
    iceberg.nessie-catalog.default-warehouse-dir=s3://ecom-etl/warehouse

    # Native S3 filesystem — required for MinIO
    fs.native-s3.enabled=true
    s3.endpoint=http://minio.ecom-local.svc.cluster.local:9000
    s3.path-style-access=true
    s3.region=us-east-1

    # Credentials sourced from a K8s Secret via pod env vars — never hardcode in a ConfigMap
    s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
    s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}

    # Lets you re-attach an existing metadata.json (handy for the recovery workflow we discussed)
    iceberg.register-table-procedure.enabled=true
