apiVersion: v1
kind: ConfigMap
metadata:
  name: ecom-config
  namespace: ecom-pre-prod
data:
  # -- Trino
  TRINO_HOST: "trino"
  TRINO_PORT: "8080"
  TRINO_USER: "trino"
  TRINO_CATALOG: "iceberg"
  TRINO_SCHEMA: "mart"

  # -- Nessie
  NESSIE_URI: "http://nessie:19120"
  ICEBERG_WAREHOUSE: "s3://ecom-platform-warehouse-pre-prod/warehouse"

  # -- Qdrant — dimension must match MODEL_EMBEDDING output
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: "semantic_layer"
  QDRANT_SIZE: "1536"                        # ← was 384, now matches text-embedding-3-small

  # -- Embedding model (OpenAI API — no local model, no torch)
  MODEL_EMBEDDING: "text-embedding-3-small"  # ← was missing

  # -- Valkey
  VALKEY_HOST: "valkey"
  VALKEY_PORT: "6379"
  VALKEY_TTL: "3600"

  # -- App config
  LOG_LEVEL: "WARNING"
  JSON_LOGS: "true"
  MCP_HTTP_TIMEOUT: "60.0"