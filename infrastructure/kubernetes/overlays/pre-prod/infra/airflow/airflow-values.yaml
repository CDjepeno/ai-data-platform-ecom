# ─────────────────────────────────────
# EXECUTOR
# ─────────────────────────────────────
executor: LocalExecutor

# ─────────────────────────────────────
# CUSTOM IMAGE — etl_ecom installed
# ─────────────────────────────────────
images:
  airflow:
    repository: airflow-ecom
    tag: local
    pullPolicy: Never

# ─────────────────────────────────────
# DAGs — gitSync from GitHub
# ─────────────────────────────────────
dags:
  gitSync:
    enabled: true
    repo: https://github.com/CDjepeno/ai-data-platform-ecom.git
    branch: feat/add-airbyte-and-marketing-source
    subPath: src/airflow/dags
    period: 60s
    recommendedProbeSetting: true
    credentialsSecret: airflow-git-secret 

# ─────────────────────────────────────
# WEBSERVER
# ─────────────────────────────────────
createUserJob:
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    email: djepenodev@gmail.com
    password: admin

# ─────────────────────────────────────
# METADATA DB — bundled PostgreSQL
# ─────────────────────────────────────
postgresql:
  enabled: true

# ─────────────────────────────────────
# MISC
# ─────────────────────────────────────
config:
  core:
    load_examples: "False"

# ─────────────────────────────────────
# SCHEDULER
# ─────────────────────────────────────
scheduler:
  waitForMigrations:
    enabled: true
    env:
      - name: AIRFLOW__DATABASE__MIGRATION_WAIT_TIMEOUT
        value: "300"  # increase from 60s to 300s

# ─────────────────────────────────────
# SECRETS 
# ─────────────────────────────────────
secret:
  - envName: "POSTGRES_DB"
    secretName: "postgres-secret"
    secretKey: "POSTGRES_DB"
  - envName: "POSTGRES_USER"
    secretName: "postgres-secret"
    secretKey: "POSTGRES_USER"
  - envName: "POSTGRES_PASSWORD"
    secretName: "postgres-secret"
    secretKey: "POSTGRES_PASSWORD"
  - envName: "POSTGRES_HOST"
    secretName: "postgres-secret"
    secretKey: "POSTGRES_HOST"
  - envName: "POSTGRES_PORT"
    secretName: "postgres-secret"
    secretKey: "POSTGRES_PORT"
  - envName: "MINIO_ENDPOINT"
    secretName: "minio-secret"
    secretKey: "MINIO_ENDPOINT"
  - envName: "MINIO_ROOT_USER"
    secretName: "minio-secret"
    secretKey: "MINIO_ROOT_USER"
  - envName: "MINIO_ROOT_PASSWORD"
    secretName: "minio-secret"
    secretKey: "MINIO_ROOT_PASSWORD"
  - envName: "AWS_ACCESS_KEY_ID"
    secretName: "minio-secret"
    secretKey: "AWS_ACCESS_KEY_ID"
  - envName: "AWS_SECRET_ACCESS_KEY"
    secretName: "minio-secret"
    secretKey: "AWS_SECRET_ACCESS_KEY"
  - envName: "SEMANTIC_LAYER_URL"
    secretName: "etl-extra-secret"
    secretKey: "SEMANTIC_LAYER_URL"
  - envName: "NESSIE_URI"
    secretName: "etl-extra-secret"
    secretKey: "NESSIE_URI"
  - envName: "ICEBERG_WAREHOUSE"
    secretName: "etl-extra-secret"
    secretKey: "ICEBERG_WAREHOUSE"
  - envName: "MINIO_BUCKET"
    secretName: "minio-secret"
    secretKey: "MINIO_BUCKET"
  - envName: "MINIO_REGION"
    secretName: "minio-secret"
    secretKey: "MINIO_REGION"

# ─────────────────────────────────────
# TRIGGERER  
# ─────────────────────────────────────
triggerer:
  waitForMigrations:
    enabled: true
    env:
      - name: AIRFLOW__DATABASE__MIGRATION_WAIT_TIMEOUT
        value: "300"

# ─────────────────────────────────────
# GLOBAL ENV
# ─────────────────────────────────────
env:
  - name: AIRFLOW__DATABASE__MIGRATION_WAIT_TIMEOUT
    value: "300"
  - name: PYTHONPATH
    value: "/opt/etl_ecom"