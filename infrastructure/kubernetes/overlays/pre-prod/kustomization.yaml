# overlays/pre-prod/kustomization.yml
# Pre-prod overlay — mirrors prod topology with reduced resources.
# Images are pinned to CI-built SHA tags, never :latest.
# Secrets are injected via CI pipeline (GitHub Actions Secrets).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecom-pre-prod

resources:
  - namespace.yml
  - configmap-env.yml
  - ../../base/valkey/
  - ../../base/qdrant/
  - ../../base/nessie/
  - ../../base/trino/
  - ../../base/semantic-layer/
  - ../../base/fastapi/
  - ../../base/nextjs/
  - ../../base/etl-pipeline/
  - ../../base/mcp/
  - trino-configmap.yml
  - dbt-profiles-configmap.yml

  # [NOTE] NO postgres/ — using OVH Managed PostgreSQL (Terraform)
  # [NOTE] NO minio/ — using OVH Object Storage S3 (Terraform)

# Tags updated automatically by GitHub Actions on every deploy
# NEVER edit these manually — CI owns these values
images:
  - name: ghcr.io/cdjepeno/ecom-fastapi
    newTag: ci-managed
  - name: ghcr.io/cdjepeno/ecom-semantic-layer
    newTag: ci-managed
  - name: ghcr.io/cdjepeno/ecom-nextjs
    newTag: ci-managed
  - name: ghcr.io/cdjepeno/ecom-mcp
    newTag: ci-managed
  - name: ghcr.io/cdjepeno/ecom-pipeline          # fix: was ecom-etl
    newTag: ci-managed

patches:
  # [PRE-PROD] Always pull from ghcr.io — never use cached local image
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fastapi
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-secret
            containers:
              - name: fastapi
                imagePullPolicy: Always
    target:
      kind: Deployment
      name: fastapi

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: semantic-layer
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-secret
            containers:
              - name: semantic-layer
                imagePullPolicy: Always
    target:
      kind: Deployment
      name: semantic-layer

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nextjs
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-secret
            containers:
              - name: nextjs
                imagePullPolicy: Always
    target:
      kind: Deployment
      name: nextjs

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-secret
            containers:
              - name: mcp
                imagePullPolicy: Always
    target:
      kind: Deployment
      name: mcp

  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: etl-pipeline
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-secret
            containers:
              - name: etl
                imagePullPolicy: Always
    target:
      kind: Job
      name: etl-pipeline

generatorOptions:
  disableNameSuffixHash: true
