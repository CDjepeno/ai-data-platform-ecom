# overlays/pre-prod/kustomization.yml
# Pre-prod overlay — mirrors prod topology with reduced resources.
# Images are pinned to CI-built tags, never :latest.
# Secrets are injected via CI pipeline (GitHub Actions Secrets).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecom-pre-prod

resources:
  - namespace.yml
  - configmap-env.yml
  - ../../base/valkey/
  - ../../base/qdrant/
  - ../../base/nessie/
  - ../../base/trino/
  - ../../base/semantic-layer/
  - ../../base/fastapi/
  - ../../base/nextjs/
  - ../../base/etl-pipeline/

# Pin to CI-built SHA tags — updated automatically by GitHub Actions
# NEVER use :latest in pre-prod — you must know exactly what is running
images:
  - name: ghcr.io/cdjepeno/ecom-fastapi
    newTag: "297a3e6"
  - name: ghcr.io/cdjepeno/ecom-semantic-layer
    newTag: "297a3e6"
  - name: ghcr.io/cdjepeno/ecom-nextjs
    newTag: "a9da54c"

