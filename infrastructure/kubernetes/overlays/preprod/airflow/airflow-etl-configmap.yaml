apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-etl-config
  namespace: airflow
data:
  POSTGRES_DB: "ecom_db"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "ecom_user" 
  POSTGRES_HOST: "postgres-source-rw.postgres.svc.cluster.local"

  ICEBERG_WAREHOUSE: "s3://ecom-etl/warehouse"
  NESSIE_URI: "http://nessie.ecom-preprod.svc.cluster.local:19120/iceberg"

  MINIO_BUCKET: "ecom-etl"
  MINIO_REGION: "us-east-1"
  MINIO_ENDPOINT: "http://minio.ecom-preprod.svc.cluster.local:9000"

  SEMANTIC_LAYER_URL: "http://semantic-layer.ecom-preprod.svc.cluster.local:8001"
  AIRBYTE_BASE_URL: "http://airbyte-airbyte-server-svc.airbyte.svc.cluster.local:8001/api/public/v1"
