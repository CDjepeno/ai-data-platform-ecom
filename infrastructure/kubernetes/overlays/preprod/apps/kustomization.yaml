apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecom-preprod

resources:
  - ../../../base/semantic-layer/
  - ../../../base/fastapi/
  - ../../../base/nextjs/
  - ../../../base/etl-pipeline/
  - ../../../base/mcp/
  - dbt-profiles-configmap.yml
  - http-route-fastapi.yaml
  - http-route-nextjs.yaml

# Tags updated automatically by GitHub Actions on every deploy.
# NEVER edit these manually — CI owns these values.
images:
  - name: ghcr.io/cdjepeno/ecom-fastapi
    newTag: ci-managed
  - name: ghcr.io/cdjepeno/ecom-semantic-layer
    newTag: ci-managed
  - name: ghcr.io/cdjepeno/ecom-nextjs
    newTag: ci-managed
  - name: ghcr.io/cdjepeno/ecom-mcp
    newTag: ci-managed
  - name: ghcr.io/cdjepeno/ecom-pipeline
    newTag: ci-managed

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fastapi
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-secret
            containers:
              - name: fastapi
                imagePullPolicy: Always
    target:
      kind: Deployment
      name: fastapi

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: semantic-layer
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-secret
            containers:
              - name: semantic-layer
                imagePullPolicy: Always
    target:
      kind: Deployment
      name: semantic-layer

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nextjs
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-secret
            containers:
              - name: nextjs
                imagePullPolicy: Always
    target:
      kind: Deployment
      name: nextjs

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-secret
            containers:
              - name: mcp
                imagePullPolicy: Always
    target:
      kind: Deployment
      name: mcp

  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: etl-pipeline
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-secret
            containers:
              - name: etl
                imagePullPolicy: Always
    target:
      kind: Job
      name: etl-pipeline

generatorOptions:
  disableNameSuffixHash: true
