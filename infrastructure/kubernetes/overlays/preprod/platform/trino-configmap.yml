apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog
  # No namespace — Kustomize injects it
data:
  iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=nessie
    iceberg.nessie-catalog.uri=http://nessie.ecom-preprod.svc.cluster.local:19120/api/v1
    iceberg.nessie-catalog.ref=main
    iceberg.nessie-catalog.default-warehouse-dir=s3://ecom-etl/warehouse
    fs.native-s3.enabled=true
    s3.endpoint=http://minio.ecom-preprod.svc.cluster.local:9000http://minio:9000
    s3.path-style-access=true
    s3.region=us-east-1
