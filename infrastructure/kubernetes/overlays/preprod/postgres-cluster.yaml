# infrastructure/kubernetes/preprod/postgres-cluster.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-source
  namespace: postgres
spec:
  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  # --- Bootstrap: initial state of a brand-new cluster ---
  bootstrap:
    initdb:
      database: ecom_db              # Application database created at bootstrap.
      owner: ecom_user             # Owner role; matches the Secret username.
      secret:
        name: postgres-source-credentials   # From step 2.
      dataChecksums: true         # Silently detects I/O corruption. Cannot be
                                  # changed later — must enable at bootstrap.
      encoding: UTF8

      # Run your SQL at bootstrap, in lexical order, as ecom_app on the ecom db.
      # WHY postInitApplicationSQLRefs vs postInitSQL: "Application" runs on
      # YOUR db as the app user (correct for schema/seed). Plain postInitSQL
      # runs as superuser on the 'postgres' db (wrong scope here).
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: postgres-source-init-sql
            key: 01_init.sql
          - name: postgres-source-init-sql
            key: 02_seed.sql

  # --- Storage: operator creates one PVC per instance ---
  storage:
    size: 5Gi
    # storageClassName omitted -> uses k3s default (local-path on Hetzner).

  # --- Resources: realistic floor for a preprod DB ---
  # WHY explicit limits: predictable scheduling + no noisy-neighbor surprises.
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
