[project]
name = "etl-ecom"
version = "0.1.0"
description = ""
authors = [
    {name = "CDjepeno",email = "djepenodev@gmail.com"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "boto3 (==1.40.18)",
    "pyarrow (>=24.0.0,<25.0.0)",
    "pyiceberg (>=0.11.1,<0.12.0)",
    "s3fs (==2025.3.2)",
    "dbt-trino (>=1.10.1,<2.0.0)",
    "trino (>=0.337.0,<0.338.0)",
    "duckdb (>=1.5.2,<2.0.0)",
    "keyring (>=25.7.0,<26.0.0)",
    "keyrings-alt (>=5.0.2,<6.0.0)"
]

[tool.poetry]
packages = [{include = "etl_ecom", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "sqlfluff (>=4.1.0,<5.0.0)",
    "sqlfluff-templater-dbt (>=4.1.0,<5.0.0)",
    "ruff (>=0.15.12,<0.16.0)"
]
