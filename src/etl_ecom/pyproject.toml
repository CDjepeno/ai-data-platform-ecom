[project]
name = "etl-ecom"
version = "0.1.0"
description = "ETL and lakehouse pipeline for ecommerce analytics"

authors = [
    { name = "CDjepeno", email = "djepenodev@gmail.com" }
]

requires-python = ">=3.11,<3.13"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"


# ─────────────────────────────────────
# DATABASE
# ─────────────────────────────────────

psycopg2-binary = ">=2.9.12,<3.0.0"
sqlalchemy = ">=2.0.49,<3.0.0"

# ─────────────────────────────────────
# DATA PROCESSING
# ─────────────────────────────────────

pandas = ">=2.2.0,<3.0.0"

pyarrow = ">=14.0.0,<15.0.0"

duckdb = ">=1.5.2,<2.0.0"

# ─────────────────────────────────────
# AWS / S3 / STORAGE
# ─────────────────────────────────────

boto3 = "==1.40.18"

s3fs = "2023.12.2"

# ─────────────────────────────────────
# ICEBERG / LAKEHOUSE
# ─────────────────────────────────────

pyiceberg = "^0.7.0"

# ─────────────────────────────────────
# QUERY ENGINE
# ─────────────────────────────────────

trino = ">=0.337.0,<0.338.0"

# ─────────────────────────────────────
# CONFIG
# ─────────────────────────────────────

pyyaml = ">=6.0.3,<7.0.0"

httpx = ">=0.28.1,<0.29.0"

pydantic = "^2.11.7"

pydantic-settings = "^2.10.1"

python-dotenv = ">=1.2.2,<2.0.0"

# ─────────────────────────────────────
# DEV
# ─────────────────────────────────────

[tool.poetry.group.dev.dependencies]

ruff = ">=0.15.12,<0.16.0"

sqlfluff = ">=4.1.0,<5.0.0"

# sqlfluff-templater-dbt removed
# because dbt moved to semantic_layer

# ─────────────────────────────────────
# BUILD
# ─────────────────────────────────────

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]

build-backend = "poetry.core.masonry.api"

