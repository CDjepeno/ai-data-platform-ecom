version: 2

models:
  - name: fact_orders
    description: "Fait des commandes de l'e-commerce"

    columns:

      - name: order_id
        tests:
          - not_null
          - unique

      - name: branch_sk
        description: "FK vers dim_branches"
        tests:
          - not_null
          - relationships:
              to: ref('dim_branches')
              field: branch_sk

      - name: customer_sk
        description: "FK vers dim_customers"
        tests:
          - not_null

          - relationships:
              to: ref('dim_customers')
              field: customer_sk

      - name: date_sk
        description: "FK vers dim_date"
        tests:
          - not_null

          - relationships:
              to: ref('dim_date')
              field: date_sk