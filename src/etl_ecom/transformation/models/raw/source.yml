version: 2

sources:
  - name: raw
    description: >
      Couche bronze contenant les données brutes ingestées
      depuis les systèmes sources ecommerce.

    schema: raw

    tables:

      # ==========================================================
      # CUSTOMERS
      # ==========================================================

      - name: customers
        description: Données brutes des clients ecommerce

        columns:
          - name: customer_id
            description: Identifiant unique du client
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: ref('raw', 'users')
                    field: user_id

      # ==========================================================
      # ORDERS
      # ==========================================================

      - name: orders
        description: Données brutes des commandes

        columns:
          - name: order_id
            description: Identifiant unique de commande
            tests:
              - not_null

          - name: customer_id
            description: Référence du client
            tests:
              - relationships:
                  arguments:
                    to: ref('raw', 'customers')
                    field: customer_id

          - name: branch_id
            description: Référence de la branche/store
            tests:
              - relationships:
                  arguments:
                    to: source('raw', 'branches')
                    field: branch_id

      # ==========================================================
      # ORDER ITEMS
      # ==========================================================

      - name: order_items
        description: Lignes produits des commandes

        columns:
          - name: order_item_id
            description: Identifiant unique de ligne commande
            tests:
              - not_null

          - name: order_id
            description: Référence de commande
            tests:
              - relationships:
                  arguments:
                    to: ref('raw', 'orders')
                    field: order_id

          - name: product_id
            description: Référence produit
            tests:
              - relationships:
                  arguments:
                    to: ref('raw', 'products')
                    field: product_id

      # ==========================================================
      # PRODUCTS
      # ==========================================================

      - name: products
        description: Catalogue brut des produits

        columns:
          - name: product_id
            description: Identifiant unique produit
            tests:
              - not_null

      # ==========================================================
      # CATEGORIES
      # ==========================================================

      - name: categories
        description: Catégories produits

        columns:
          - name: category_id
            description: Identifiant unique catégorie
            tests:
              - not_null

      # ==========================================================
      # PRODUCT CATEGORIES
      # ==========================================================

      - name: product_categories
        description: Table de liaison produits-catégories

        columns:
        - name: product_id
          description: Référence produit
          tests:
            - not_null
            - relationships:
                arguments:
                  to: ref('raw', 'products')
                  field: product_id

        - name: category_id
          description: Référence catégorie
          tests:
            - not_null
            - relationships:
                arguments:
                  to: ref('raw', 'categories')
                  field: category_id

      # ==========================================================
      # BRANCHES
      # ==========================================================

      - name: branches
        description: Informations des branches/stores

        columns:
          - name: branch_id
            description: Identifiant unique branche
            tests:
              - not_null

      # ==========================================================
      # BRANCH PRODUCTS
      # ==========================================================

      - name: branch_products
        description: Produits disponibles par branche

        columns:
          - name: branch_id
            description: Référence branche
            tests:
              - relationships:
                  arguments:
                    to: ref('raw', 'branches')
                    field: branch_id
          - name: product_id
            description: Référence produit
            tests:
              - relationships:
                  arguments:
                    to: ref('raw', 'products')
                    field: product_id

      # ==========================================================
      # PAYMENTS
      # ==========================================================

      - name: payments
        description: Paiements des commandes

        columns:
          - name: payment_id
            description: Identifiant unique paiement
            tests:
              - not_null

          - name: order_id
            description: Référence commande
            tests:
            - relationships:
                arguments:
                  to: ref('raw', 'orders')
                  field: order_id

      # ==========================================================
      # SHIPMENTS
      # ==========================================================

      - name: shipments
        description: Expéditions et livraisons

        columns:
          - name: shipment_id
            description: Identifiant unique shipment
            tests:
              - not_null

          - name: order_id
            description: Référence commande
            tests:
              - relationships:
                  arguments:
                    to: ref('raw', 'orders')
                    field: order_id
      # ==========================================================
      # USERS
      # ==========================================================

      - name: users
        description: Utilisateurs internes / administrateurs

        columns:
          - name: user_id
            description: Identifiant unique utilisateur
            tests:
              - not_null


