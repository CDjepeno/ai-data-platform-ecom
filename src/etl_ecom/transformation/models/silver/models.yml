# models/silver/schema.yml
version: 2

models:
  - name: stg_branches
    description: "Données branches nettoyées et standardisées"
    
    columns:
      - name: branch_id
        description: "Identifiant unique de la branche (clé primaire)"
        tests:
          - not_null
          - unique

      - name: name
        description: "Nom du store"
        tests:
          - not_null

      - name: city
        description: "Ville du store"
        tests:
          - not_null

      - name: country
        description: "Pays du store"
        tests:
          - not_null
  
  - name: stg_customers
    description: "Données clients nettoyées et standardisées"
    
    columns:
      - name: customer_id
        description: "Identifiant unique du client (clé primaire)"
        tests:
          - not_null
          - unique

      - name: first_name
        description: "Prénom du client"
        tests:
          - not_null

      - name: last_name
        description: "Nom de famille du client"
        tests:
          - not_null

      - name: email
        description: "Adresse email du client"
        tests:
          - not_null
          - unique