[project]
name = "ecom-api"
version = "0.1.0"
requires-python = ">=3.11,<3.13"



dependencies = [
    "fastapi>=0.136.1,<0.137.0",
    "uvicorn>=0.46.0,<0.47.0",
    "httpx>=0.28.1,<0.29.0",

    "python-dotenv>=1.2.2,<2.0.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
