[tool.poetry]
name = "mcp-gateway"
version = "0.1.0"
description = "MCP Server + Slack Bot — generic gateway over any FastAPI /ask endpoint"
authors = ["Toi <toi@email.com>"]

# package-mode = false : this is a service (application), not a library to publish.
package-mode = false

# ── Runtime dependencies ───────────────────────────────────────────────────────
[tool.poetry.dependencies]
python            = "^3.11"
mcp               = "^1.3.0"
httpx             = "^0.27.0"
slack-bolt        = "^1.20.0"
slack-sdk         = "^3.31.0"
pydantic          = "^2.7.0"
pydantic-settings = "^2.3.0"
anyio             = "^4.4.0"

# ── Dev dependencies ───────────────────────────────────────────────────────────
[tool.poetry.group.dev.dependencies]
pytest            = "^8.2.0"
pytest-asyncio    = "^0.23.0"
pytest-mock       = "^3.14.0"
pytest-cov        = "^7.1.0"
respx             = "^0.21.0"
ruff              = "^0.4.0"
mypy              = "^1.10.0"

# ── CLI entry points ───────────────────────────────────────────────────────────
[tool.poetry.scripts]
mcp-server  = "infrastructure.mcp.server:main_sync"
slack-bot   = "infrastructure.adapters.slack.bot:main_sync"

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length    = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
pythonpath   = ["."]

# ── Build backend ─────────────────────────────────────────────────────────────
[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"