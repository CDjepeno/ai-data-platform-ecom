[project]
name = "semantic-layer"
version = "0.1.0"
description = "DBT Semantic Layer with MetricFlow"
requires-python = ">=3.11,<3.13"

dependencies = [
    "dbt-core>=1.10,<1.11",
    "dbt-trino>=1.10,<1.11",
    "dbt-metricflow>=0.10,<0.11",
    "langgraph>=1.1.10,<2.0.0",
    "langchain>=1.2.18,<2.0.0",
    "openai>=2.36.0,<3.0.0",
    "pyiceberg>=0.7,<0.8",

    "qdrant-client>=1.17.1,<2.0.0",
    "sentence-transformers>=5.4.1,<6.0.0",


    "python-dotenv>=1.2.2,<2.0.0",
    "pyyaml>=6.0.3,<7.0.0",

    "trino>=0.337.0,<0.338.0",

    "fastapi",
    "uvicorn",
    "prometheus-client>=0.20.0,<1.0.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false