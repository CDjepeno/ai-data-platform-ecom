version: 2

models:
  - name: dim_branches
    description: "Dimension des magasins/branches de l'e-commerce"
    columns:
      - name: branch_id
        tests:
          - not_null
          - unique

  - name: dim_customers
    description: "Dimension des clients de l'e-commerce"
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
          
  - name: dim_users
    description: "Dimension des utilisateurs de l'e-commerce"
    columns:
      - name: user_id
        tests:
          - not_null
          - unique

  - name: dim_products
    description: "SCD2 product dimension tracking price and name changes over time"
    columns:
      - name: product_sk
        tests:
          - not_null
          - unique
      - name: product_sku
        tests:
          - not_null

  - name: dim_campaigns
    description: "Unified campaign dimension across Meta, TikTok, and Google with computed KPIs"
    columns:
      - name: campaign_sk
        tests:
          - not_null
          - unique
      - name: campaign_id
        tests:
          - not_null
      - name: platform
        tests:
          - not_null

      