semantic_models:

  - name: customers

    description: Semantic model representing ecommerce customers

    model: ref('dim_customers')

    defaults:
      agg_time_dimension: created_at

    entities:

      - name: customer
        type: primary
        expr: customer_id

    dimensions:

      - name: first_name
        type: categorical

      - name: last_name
        type: categorical

      - name: city
        type: categorical

      - name: country
        type: categorical

      - name: created_at
        type: time
        type_params:
          time_granularity: day

    measures:

      - name: customer_count
        agg: count_distinct
        expr: customer_id

