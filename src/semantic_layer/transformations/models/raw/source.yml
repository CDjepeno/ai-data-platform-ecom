version: 2

sources:
  - name: raw
    description: >
      Bronze layer containing raw ingested data
      from ecommerce source systems.

    schema: raw

    tables:

      # ==========================================================
      # CUSTOMERS
      # ==========================================================

      - name: customers
        description: Raw ecommerce customer data

        columns:
          - name: customer_id
            description: Unique customer identifier
            tests:
              - not_null

          - name: user_id
            description: Reference to the user


      # ==========================================================
      # ORDERS
      # ==========================================================

      - name: orders
        description: Raw order data

        columns:
          - name: order_id
            description: Unique order identifier
            tests:
              - not_null

          - name: customer_id
            description: Reference to the customer
    

          - name: branch_id
            description: Reference to the branch/store
  

      # ==========================================================
      # ORDER ITEMS
      # ==========================================================

      - name: order_items
        description: Order line items

        columns:
          - name: order_item_id
            description: Unique order line identifier
            tests:
              - not_null

          - name: order_id
            description: Reference to the order


          - name: product_id
            description: Reference to the product


      # ==========================================================
      # PRODUCTS
      # ==========================================================

      - name: products
        description: Raw product catalog

        columns:
          - name: product_id
            description: Unique product identifier
            tests:
              - not_null

      # ==========================================================
      # CATEGORIES
      # ==========================================================

      - name: categories
        description: Product categories

        columns:
          - name: category_id
            description: Unique category identifier
            tests:
              - not_null

      # ==========================================================
      # PRODUCT CATEGORIES
      # ==========================================================

      - name: product_categories
        description: Product–category bridge table

        columns:
          - name: product_id
            description: Reference to the product
            tests:
              - not_null

          - name: category_id
            description: Reference to the category
            tests:
              - not_null


      # ==========================================================
      # BRANCHES
      # ==========================================================

      - name: branches
        description: Branch/store information

        columns:
          - name: branch_id
            description: Unique branch identifier
            tests:
              - not_null

      # ==========================================================
      # BRANCH PRODUCTS
      # ==========================================================

      - name: branch_products
        description: Products available per branch

        columns:
          - name: branch_id
            description: Reference to the branch


          - name: product_id
            description: Reference to the product


      # ==========================================================
      # PAYMENTS
      # ==========================================================

      - name: payments
        description: Order payments

        columns:
          - name: payment_id
            description: Unique payment identifier
            tests:
              - not_null

          - name: order_id
            description: Reference to the order


      # ==========================================================
      # SHIPMENTS
      # ==========================================================

      - name: shipments
        description: Shipments and deliveries

        columns:
          - name: shipment_id
            description: Unique shipment identifier
            tests:
              - not_null

          - name: order_id
            description: Reference to the order
 
      # ==========================================================
      # USERS
      # ==========================================================

      - name: users
        description: Internal users / administrators

        columns:
          - name: user_id
            description: Unique user identifier
            tests:
              - not_null


