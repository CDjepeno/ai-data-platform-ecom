# models/staging_intermediate/models.yml
version: 2

models:
  - name: stg_order_items
    description: "Cleaned order line items with computed line_total"
    columns:
      - name: order_item_id
        tests:
          - not_null
          - unique

  - name: int_campaigns
    description: "Unified campaigns across Meta, TikTok, and Google — UNION ALL of stg_*_campaigns"
    columns:
      - name: campaign_id
        tests:
          - not_null

  - name: stg_branches
    description: "Cleaned and standardized branch data"

    columns:
      - name: branch_id
        description: "Unique branch identifier (primary key)"
        tests:
          - not_null
          - unique

      - name: name
        description: "Store name"
        tests:
          - not_null

      - name: city
        description: "Store city"
        tests:
          - not_null

      - name: country
        description: "Store country"
        tests:
          - not_null


  - name: stg_customers
    description: "Cleaned and standardized customer data"

    columns:
      - name: customer_id
        description: "Unique customer identifier (primary key)"
        tests:
          - not_null
          - unique

      - name: first_name
        description: "Customer first name"
        tests:
          - not_null

      - name: last_name
        description: "Customer last name"
        tests:
          - not_null


  - name: stg_users
    description: "Cleaned and standardized user data"

    columns:
      - name: user_id
        description: "Unique user identifier (primary key)"
        tests:
          - not_null
          - unique


  - name: stg_orders
    description: "Cleaned and standardized order data"

    columns:
      - name: order_id
        description: "Unique order identifier (primary key)"
        tests:
          - not_null
          - unique

  - name: stg_meta_campaigns
    description: "Cleaned Meta Ads campaign data — types cast, status normalized, deduplicated"

    columns:
      - name: campaign_id
        description: "Unique Meta campaign identifier (primary key)"
        tests:
          - not_null
          - unique

      - name: platform
        description: "Ad platform — always 'meta' in this model"
        tests:
          - not_null

      - name: start_date
        description: "Campaign start date (DATE)"
        tests:
          - not_null

      - name: end_date
        description: "Campaign end date (DATE)"
        tests:
          - not_null

  - name: stg_tiktok_campaigns
    description: "Cleaned TikTok Ads campaign data — types cast, status normalized, deduplicated"

    columns:
      - name: campaign_id
        description: "Unique TikTok campaign identifier (primary key)"
        tests:
          - not_null
          - unique

      - name: platform
        description: "Ad platform — always 'tiktok' in this model"
        tests:
          - not_null

      - name: start_date
        description: "Campaign start date (DATE)"
        tests:
          - not_null

      - name: end_date
        description: "Campaign end date (DATE)"
        tests:
          - not_null

  - name: stg_products
    description: "Cleaned and standardized product catalog"

    columns:
      - name: product_id
        description: "Unique product identifier (primary key)"
        tests:
          - not_null
          - unique

      - name: product_sku
        description: "Business SKU — unique per product"
        tests:
          - not_null
          - unique

      - name: name
        description: "Product name"
        tests:
          - not_null

      - name: price
        description: "Unit price"
        tests:
          - not_null

  - name: stg_google_campaigns
    description: "Cleaned Google Ads campaign data — types cast, status normalized, deduplicated"

    columns:
      - name: campaign_id
        description: "Unique Google campaign identifier (primary key)"
        tests:
          - not_null
          - unique

      - name: platform
        description: "Ad platform — always 'google_ads' in this model"
        tests:
          - not_null

      - name: start_date
        description: "Campaign start date (DATE)"
        tests:
          - not_null

      - name: end_date
        description: "Campaign end date (DATE)"
        tests:
          - not_null

